# Cross-compilation configuration for KeePassKeyWin Provider.
#
# Windows MSVC target via cargo-xwin (self-managed SDK cache):
#   cargo xwin build --target x86_64-pc-windows-msvc --release
#
# cargo-xwin injects the correct -L paths at build time from its own
# cache (~/.xwin-cache or .xwin-cache/ in the crate directory).
# Do NOT set rustflags -Lnative here — it conflicts with xwin's injection.
#
# See README.md for full setup instructions.

# Alternative: GNU toolchain via mingw-w64 (no MSVC SDK required, limited compat).
# [target.x86_64-pc-windows-gnu]
# linker = "x86_64-w64-mingw32-gcc"
