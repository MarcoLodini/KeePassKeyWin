[package]
name = "keepasskeywin-provider"
version = "0.0.1"
edition = "2021"
authors = ["Marco Lodini and contributors"]
license = "GPL-3.0-or-later"
description = "KeePassKeyWin Windows Passkey Provider sidecar — MSIX-packaged IPluginAuthenticator COM server bridging Windows WebAuthn to the KeePassKeyWin KeePass 2.x plugin over IPC."
publish = false

# CLI binary (smoke-test / make-credential subcommands).
[[bin]]
name = "keepasskeywin-provider"
path = "src/main.rs"

# Library crate — shared logic used by the keepasskeywin-provider binary.
# Out-of-process COM activation is handled by the binary (ExeServer); no cdylib needed.
[lib]
name = "keepasskeywin_provider"
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
passkey-types = "0.4"
sha2 = "0.10"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
base64 = "0.22"
futures = { version = "0.3", default-features = false, features = ["std"] }

# 5.UV.9.5: only used by `make_credential_cbor` in `prompt_hint_tests` (a
# #[cfg(windows)] test fixture). `coset` is already a transitive dep via
# `passkey-types`, but Rust 2018+ requires direct `[dependencies]` entries
# for `use coset::*`. Pinned to `^0.3` to match the resolved 0.3.8 in
# `Cargo.lock`. This eliminates the on-Windows lib-test compile error that
# was hidden because Linux CI runs `cargo test --target=<host>` (cfgs out
# the fixture) and `cargo xwin build` doesn't compile tests.
[dev-dependencies]
coset = "0.3"

# Phase 2b: windows-rs COM bindings — Windows only.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
