[package]
name = "passkee-provider"
version = "0.0.1"
edition = "2021"
authors = ["Marco Lodini and contributors"]
license = "GPL-3.0-or-later"
description = "PassKee Windows Passkey Provider sidecar — MSIX-packaged IPluginAuthenticator COM server bridging Windows WebAuthn to the PassKee KeePass 2.x plugin over IPC."
publish = false

[[bin]]
name = "passkee-provider"
path = "src/main.rs"

# Windows-only. Dependencies pinned as they are adopted in later phases.
# [target.'cfg(windows)'.dependencies]
# windows       = { version = "0.61", features = [] }
# windows-core  = "0.61"
# passkey-types = "0.4"
# tokio         = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }
# serde         = { version = "1", features = ["derive"] }
# serde_json    = "1"
# ciborium      = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
