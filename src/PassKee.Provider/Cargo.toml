[package]
name = "passkee-provider"
version = "0.0.1"
edition = "2021"
authors = ["Marco Lodini and contributors"]
license = "GPL-3.0-or-later"
description = "PassKee Windows Passkey Provider sidecar — MSIX-packaged IPluginAuthenticator COM server bridging Windows WebAuthn to the PassKee KeePass 2.x plugin over IPC."
publish = false

[[bin]]
name = "passkee-provider"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
passkey-types = "0.4"
sha2 = "0.10"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
base64 = "0.22"

# Windows COM/MSIX — uncomment when Phase 2b (Windows build) begins.
# [target.'cfg(windows)'.dependencies]
# windows       = { version = "0.61", features = [] }
# windows-core  = "0.61"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
