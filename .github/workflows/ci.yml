name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore KeePassKeyWin.sln

      - name: Test
        run: dotnet test KeePassKeyWin.sln --no-restore --nologo --verbosity normal

  rust:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/KeePassKeyWin.Provider
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/KeePassKeyWin.Provider

      - name: Test
        run: cargo test --all-targets
